<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrinath Nursery & Farm</title>

<style>

/* Smooth fade animation for category change */
.fade-in {
    animation: fadeIn 0.35s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    color: #2e2e2e;
}

h1 {
    text-align: center;
    padding: 20px 10px 8px;
    font-size: 34px;
    color: #1b5e20;
}

/* Cart Button */

.cart-btn {
    position: fixed;
    top: 30px;
    right: 18px;
    background: none;
    color: white;
    border: #1b5e20;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Move To Top Button */

.top-btn {
    position: fixed;
    bottom: 25px;
    right: 22px;
    background: #1b5e20;
    color: white;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    display: none;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.filter-bar {
    text-align: center;
    margin-bottom: 20px;
}

.filter-btn {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    background: #e0e0e0;
    transition: 0.3s;
}

.filter-btn.active,
.filter-btn:hover {
    background: #1b5e20;
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

.card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.3s ease;
    cursor: pointer;
    position: relative;
}

.card:hover {
    transform: translateY(-6px);
}

.card.selected {
    border: 4px solid #1b5e20;
}

.card img {
    width: 100%;
    height: 480px;
    object-fit: contain;
    object-position: center;
    background: white;
    display: block;
    padding: 4px;
    box-sizing: border-box;
}

.info {
    padding: 15px;
    text-align: center;
}

.name {
    font-size: 20px;
    font-weight: 600;
    color: #1b5e20;
}

.height {
    font-size: 15px;
    color: #555;
    margin-top: 4px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}

</style>
</head>

<body>

<!-- Cart Button -->
<button class="cart-btn" onclick="sendCartToWhatsApp()">
    🛒
    <span class="cart-count" id="cartCount">0</span>
</button>

<!-- Move To Top Button -->
<button class="top-btn" id="topBtn" onclick="scrollToTop()">
    ↑
</button>

<h1>🌿 Shrinath Nursery & Farm 🌿</h1>

<div class="filter-bar">
    <button class="filter-btn active" onclick="loadCategory('exotic', this)">Exotic Collection</button>
    <button class="filter-btn" onclick="loadCategory('indoor', this)">Exclusive Indoor Plants</button>
    <button class="filter-btn" onclick="loadCategory('palms', this)">Palms</button>
</div>

<div id="gallery" class="gallery"></div>

<footer>
    N.H. No. 48, Vasad, Anand, Gujarat
</footer>

<script>

const cart = [];

const data = {

    exotic: `

        <div class="card" onclick="toggleCart(this, 'Ficus panda multi branch')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Ficus panda multi branch</div>
                <div class="height">Height: 12 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Ficus panda zig multi branch')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG2.JPG">
            <div class="info">
                <div class="name">Ficus panda zig multi branch</div>
                <div class="height">Height: 10 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Ficus microcarpa X multi branch')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG3.JPG">
            <div class="info">
                <div class="name">Ficus microcarpa X multi branch</div>
                <div class="height">Height: 7 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Ficus bonsai microcarpa')">
            <img src="https://raw.githubusercontent.com/vatxal/images/906913abdf9f896ed1bb8ab70e730832742db5f4/bonsai.jpeg">
            <div class="info">
                <div class="name">Ficus bonsai microcarpa</div>
                <div class="height">Height: 2 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Ficus nuda canopy')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG4.JPG">
            <div class="info">
                <div class="name">Ficus nuda canopy</div>
                <div class="height">Height: 7 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Ficus apollo knitted topiary')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG5.JPG">
            <div class="info">
                <div class="name">Ficus apollo knitted topiary</div>
                <div class="height">Height: 7 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Dracaena drago giant')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG6.jpg">
            <div class="info">
                <div class="name">Dracaena drago giant</div>
                <div class="height">Height: 7 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Dracaena drago')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG7.PNG">
            <div class="info">
                <div class="name">Dracaena drago</div>
                <div class="height">Height: 6 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Monstera deliciosa M/S')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG8.JPG">
            <div class="info">
                <div class="name">Monstera deliciosa M/S</div>
                <div class="height">Height: 6 ft</div>
            </div>
        </div>

    `,

    indoor: `

        <div class="card" onclick="toggleCart(this, 'Monstera deliciosa')">
            <img src="https://raw.githubusercontent.com/vatxal/images/7900c66c8f526f98ac2a2b92d6474b742e52e977/Monstera.jpeg">
            <div class="info">
                <div class="name">Monstera deliciosa</div>
                <div class="height">Height: 3.5 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Water heliconia bowl')">
            <img src="https://raw.githubusercontent.com/vatxal/images/7900c66c8f526f98ac2a2b92d6474b742e52e977/bowl.jpeg">
            <div class="info">
                <div class="name">Water heliconia bowl</div>
                <div class="height">Height: 7.5 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Dieffenbachia seguine')">
            <img src="https://raw.githubusercontent.com/vatxal/images/7900c66c8f526f98ac2a2b92d6474b742e52e977/Dieff.jpeg">
            <div class="info">
                <div class="name">Dieffenbachia seguine</div>
                <div class="height">Height: 3 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Dracaena drago 3in1')">
            <img src="https://raw.githubusercontent.com/vatxal/images/7900c66c8f526f98ac2a2b92d6474b742e52e977/drago.jpeg">
            <div class="info">
                <div class="name">Dracaena drago 3in1</div>
                <div class="height">Height: 3 ft</div>
            </div>
        </div>

    `,

    palms: `

        <div class="card" onclick="toggleCart(this, 'Veitchia palm')">
            <img src="https://raw.githubusercontent.com/vatxal/images/cac3ba77978dbb14bf0d8f554f31e96d5945dc10/vietchia.jpeg">
            <div class="info">
                <div class="name">Veitchia palm</div>
                <div class="height">Height: 8-9 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Foxtail palm')">
            <img src="https://raw.githubusercontent.com/vatxal/images/9ce53b7fc8fd5d80f81152c1969bebf0c74ffe5d/foxtail.jpeg">
            <div class="info">
                <div class="name">Foxtail palm</div>
                <div class="height">Height: 8-10 ft</div>
            </div>
        </div>

        <div class="card" onclick="toggleCart(this, 'Bottle palm')">
            <img src="https://raw.githubusercontent.com/vatxal/images/cac3ba77978dbb14bf0d8f554f31e96d5945dc10/bottle.jpeg">
            <div class="info">
                <div class="name">Bottle palm</div>
                <div class="height">Height: 8-10 ft</div>
            </div>
        </div>

    `
};

function loadCategory(category, btn) {

    const gallery = document.getElementById("gallery");

    gallery.innerHTML = "";

    gallery.classList.remove("fade-in");
    void gallery.offsetWidth;
    gallery.classList.add("fade-in");

    gallery.innerHTML = data[category];

    document.querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    restoreSelections();
}

function toggleCart(card, plantName) {

    const index = cart.indexOf(plantName);

    if (index > -1) {
        cart.splice(index, 1);
        card.classList.remove("selected");
    } else {
        cart.push(plantName);
        card.classList.add("selected");
    }

    updateCartCount();
}

function updateCartCount() {
    document.getElementById("cartCount").innerText = cart.length;
}

function restoreSelections() {

    document.querySelectorAll('.card').forEach(card => {

        const plantName = card.querySelector('.name').innerText;

        if (cart.includes(plantName)) {
            card.classList.add("selected");
        }
    });
}

function sendCartToWhatsApp() {

    if (cart.length === 0) {
        alert("Please select at least one plant.");
        return;
    }

    const phoneNumber = "919904077701";

    let message = "Hello, I am interested in the following plants:%0A%0A";

    cart.forEach((item, index) => {
        message += `${index + 1}. ${item}%0A`;
    });

    message += "%0APlease share more details.";

    window.open(`https://wa.me/${phoneNumber}?text=${message}`, "_blank");
}

/* Scroll To Top */

window.onscroll = function () {

    const topBtn = document.getElementById("topBtn");

    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        topBtn.style.display = "block";
    } else {
        topBtn.style.display = "none";
    }
};

function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

/* Default Load */

loadCategory('exotic', document.querySelector('.filter-btn'));

</script>

</body>
</html>
